# ============================================================
# ⚠  THIS IS A DEV CONFIG — DO NOT DEPLOY TO PRODUCTION  ⚠
# Production secrets are set via `wrangler secret put ADMIN_PUSH_TOKEN`.
# This file's [vars] section is for `wrangler dev` local testing only.
# ============================================================

name = "cloud-apt-worker-dev"
main = "src/index.ts"
compatibility_date = "2026-05-29"

[assets]
binding = "ASSETS"
directory = "../apt-client/dist"
run_worker_first = true
not_found_handling = "single-page-application"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1

# Local development uses Cloudflare's miniflare to mock KV + R2.
[[kv_namespaces]]
binding = "APT_KV"
id = "local-dev-kv"

[[r2_buckets]]
binding = "APT_BUCKET"
bucket_name = "local-dev-bucket"

# ADMIN_PUSH_TOKEN moved to .dev.vars (local secrets, gitignored).
# R2_ACCOUNT_ID below is a placeholder for `wrangler dev`; replace with your
# real account ID (visible at dash.cloudflare.com → R2 → overview).
# The matching R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY live in .dev.vars.
[vars]
R2_ACCOUNT_ID = "replace-me-with-your-account-id"
R2_BUCKET_NAME = "local-dev-bucket"
