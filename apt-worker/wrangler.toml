name = "cloud-apt"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Cloudflare runs this automatically on `wrangler deploy`; it builds
# apt-client into apt-worker/dist/. The Build command field in the Cloudflare
# Git import UI must be left empty so this [build] section takes over.
[build]
command = "npm --prefix ../apt-client install --no-audit --prefer-offline && npm --prefix ../apt-client run build -- --outDir ../apt-worker/dist --emptyOutDir"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true
not_found_handling = "single-page-application"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1

# Fill these in or comment them out and let the Cloudflare Dashboard auto-create.
[[kv_namespaces]]
binding = "APT_KV"
#id = "input your value and delete # or use cloudflare dashboard"

[[r2_buckets]]
binding = "APT_BUCKET"
#bucket_name = "input your value and delete # or use cloudflare dashboard"

# Production:
#   ADMIN_PUSH_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  →  `wrangler secret put`
#   R2_ACCOUNT_ID, R2_BUCKET_NAME                              →  [vars] below (public / non-secret)
# Empty [vars] kept for symmetry with wrangler-dev.toml.
[vars]

# Secrets required for /api/upload/{path}/presign (R2 S3-compatible SigV4):
#   R2_ACCESS_KEY_ID       — R2 API token Access Key ID
#   R2_SECRET_ACCESS_KEY   — R2 API token Secret Access Key
# Set both via `wrangler secret put`.
# Create the token at Cloudflare Dashboard → R2 → Manage R2 API Tokens,
# scope it to the APT_BUCKET with Object Read & Write.
# R2_ACCOUNT_ID and R2_BUCKET_NAME are public identifiers and live in [vars]
# above (or wrangler-dev.toml).

# Secrets: ADMIN_PUSH_TOKEN (set via `wrangler secret put`)
