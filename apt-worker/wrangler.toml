name = "cloud-apt"
main = "src/index.ts"
compatibility_date = "2026-05-29"

# Cloudflare 在 wrangler deploy 时自动运行, 把 apt-client 构到 apt-worker/dist/
# (Cloudflare Git 导入的 Build command 必须留空, 由本 [build] 接管)
[build]
command = "npm --prefix ../apt-client install --no-audit --prefer-offline && npm --prefix ../apt-client run build -- --outDir ../apt-worker/dist --emptyOutDir"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true
not_found_handling = "single-page-application"

[observability.logs]
enabled = true

# 用户填或注释掉让 Cloudflare Dashboard 自动创建
[[kv_namespaces]]
binding = "APT_KV"
#id = "input your value and delete # or use cloudflare dashboard"

[[r2_buckets]]
binding = "APT_BUCKET"
#bucket_name = "input your value and delete # or use cloudflare dashboard"

# Secrets: ADMIN_PUSH_TOKEN (用 wrangler secret put 设置)
