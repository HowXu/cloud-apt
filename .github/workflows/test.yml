name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run -w apt-client build -- --outDir ../apt-client/dist --emptyOutDir
      - run: npm run -w apt-worker test
      - run: npm run -w apt-worker typecheck

  client-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run -w apt-client typecheck

  worker-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run -w apt-client build
      - run: cd apt-worker && npx wrangler deploy --dry-run --outdir=dist-test
